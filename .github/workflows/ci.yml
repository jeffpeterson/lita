name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y libpcre2-dev libreadline-dev clang make
    
    - name: Build and test
      run: |
        make test
      env:
        CC: clang
        CFLAGS: "-g -Isrc -lpcre2-8 -lreadline -Wall -Werror -Wno-error=unused-variable -Wno-unused-function -Wno-unused-command-line-argument"
    
    - name: Check for uncommitted changes
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "Error: There are uncommitted changes after running tests"
          git status
          exit 1
        fi